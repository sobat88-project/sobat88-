<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobat88 - Siomay Batagor Alvian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .product-card { transition: all 0.3s; }
    .product-card:hover { transform: translateY(-5px); }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <div class="max-w-md mx-auto bg-black min-h-screen">

    <!-- HEADER -->
    <div class="bg-orange-600 py-6 text-center">
      <h1 class="text-4xl font-bold">SOBAT<span class="text-yellow-300">88</span></h1>
      <p class="text-sm">Siomay Batagor Alvian</p>
    </div>

    <!-- PROMO SIOMAY -->
    <div class="px-6 py-8 text-center bg-zinc-900 border-b border-orange-900">
      <h2 class="text-3xl font-bold mb-4">🍲 SIOMAY & BATAGOR ALVIAN</h2>
      <p class="text-lg mb-6">
        Fresh • Enak • Saus Kacang Nagih<br><br>
        <strong>Harga Spesial:</strong><br>
        • 1 biji = Rp 1.000<br>
        • Porsi Biasa = Rp 10.000<br>
        • Porsi Lengkap + Telur = Rp 13.000
      </p>
      <a href="https://wa.me/62895705786677" target="_blank" 
         class="block bg-green-600 hover:bg-green-700 py-6 rounded-3xl font-bold text-xl mb-8">
        🛵 PESAN SIOMAY SEKARANG
      </a>
    </div>

    <!-- AUDIO GOOGLE AI -->
    <div class="px-6 py-6">
      <button onclick="speakPromo()" 
              class="w-full bg-gradient-to-r from-orange-500 to-amber-500 py-6 rounded-3xl font-bold text-xl flex items-center justify-center gap-3">
        <i class="fas fa-volume-up text-3xl" id="audio-icon"></i>
        <span>DENGARKAN SUARA AI GOOGLE</span>
      </button>
    </div>

    <!-- PRODUK SHOPEE -->
    <div class="px-6 pb-8">
      <h2 class="text-orange-400 text-xl font-bold mb-6">🛒 PRODUK VIRAL SHOPEE</h2>
      <div class="space-y-4" id="product-list"></div>
    </div>

    <footer class="text-center py-10 text-gray-500 text-sm">
      © 2025 Sobat88 Project - Alvian Siomay Batagor
    </footer>
  </div>

  <script>
    // Teks untuk Suara AI Google
    const promoText = `Halo sobat semua! 
    Selamat datang di Sobat88.
    Kami menyediakan siomay batagor fresh dengan saus kacang spesial.
    Harganya sangat murah, satu biji hanya seribu rupiah.
    Porsi biasa sepuluh ribu, porsi lengkap dengan telur tiga belas ribu.
    Rasa dijamin enak dan nagih.
    Mau pesan? Langsung chat WhatsApp saja.
    Jangan lupa juga cek produk viral di Shopee di bawah ini.
    Terima kasih dan selamat berbelanja!`;

    function speakPromo() {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(promoText);
        utterance.lang = 'id-ID';           // Bahasa Indonesia
        utterance.rate = 0.95;              // Kecepatan
        utterance.pitch = 1.05;             // Nada suara
        utterance.volume = 1;

        // Coba pakai suara Google
        const voices = speechSynthesis.getVoices();
        const googleVoice = voices.find(voice => voice.name.includes('Google') && voice.lang === 'id-ID');
        if (googleVoice) utterance.voice = googleVoice;

        speechSynthesis.cancel(); // Stop kalau ada yang sedang bicara
        speechSynthesis.speak(utterance);

        // Animasi ikon
        const icon = document.getElementById('audio-icon');
        icon.classList.replace('fa-volume-up', 'fa-pause');
        setTimeout(() => icon.classList.replace('fa-pause', 'fa-volume-up'), 8000);
      } else {
        alert("Browser kamu tidak mendukung suara AI.");
      }
    }

    // === MASUKKAN PRODUK KAMU DISINI ===
    const products = [
      { name: "Kipas Portable Viral", link: "MASUKKAN_LINK_AFFILIATE_1", emoji: "🌬️" },
      { name: "Celengan Target Viral", link: "MASUKKAN_LINK_AFFILIATE_2", emoji: "💰" },
      { name: "Skincare Viral", link: "MASUKKAN_LINK_AFFILIATE_3", emoji: "🧴" },
      // Tambah lagi sesuai keinginan
    ];

    const container = document.getElementById('product-list');
    products.forEach(p => {
      const card = document.createElement('a');
      card.href = p.link;
      card.target = "_blank";
      card.className = "product-card flex items-center gap-4 bg-zinc-900 hover:bg-zinc-800 border border-orange-600 p-4 rounded-3xl";
      card.innerHTML = `
        <div class="w-16 h-16 bg-orange-600 rounded-2xl flex items-center justify-center text-4xl">${p.emoji}</div>
        <div class="flex-1 font-semibold">${p.name}</div>
        <span class="text-2xl text-orange-400">→</span>
      `;
      container.appendChild(card);
    });
  </script>
</body>
</html>
